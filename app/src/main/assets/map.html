<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <style>
        html, body, #map { height: 100%; margin: 0; padding: 0; }
        #hint {
            display: none;
            padding: 16px;
            font-family: sans-serif;
            color: #1C2B29;
            line-height: 1.6;
        }
    </style>
</head>
<body>
<div id="hint"></div>
<div id="map"></div>
<script>
    var AMAP_KEY = "{{AMAP_KEY}}";
    var AMAP_SECURITY = "{{AMAP_SECURITY}}";
    var map = null;
    var marker = null;

    function showHint(text) {
        document.getElementById("map").style.display = "none";
        var hint = document.getElementById("hint");
        hint.style.display = "block";
        hint.innerText = text;
    }

    function notifyPick(lat, lng, address) {
        if (window.Android) {
            Android.onLocationPicked(lat, lng);
            if (address) {
                Android.onAddressResolved(address);
            }
        }
    }

    function setMarker(lng, lat) {
        var pos = [lng, lat];
        if (marker) {
            marker.setPosition(pos);
        } else {
            marker = new AMap.Marker({ position: pos, map: map });
        }
        map.setZoomAndCenter(16, pos);
    }

    function moveTo(lat, lng) {
        if (!map) return;
        setMarker(lng, lat);
        reverse(lng, lat);
    }

    function reverse(lng, lat) {
        AMap.plugin("AMap.Geocoder", function () {
            var geocoder = new AMap.Geocoder({ city: "全国", radius: 1000, extensions: "all" });
            geocoder.getAddress([lng, lat], function (status, result) {
                if (status === "complete" && result.regeocode) {
                    notifyPick(lat, lng, result.regeocode.formattedAddress);
                } else {
                    notifyPick(lat, lng, "");
                }
            });
        });
    }

    function searchPlace(keyword) {
        if (!map || !keyword) return;
        AMap.plugin("AMap.PlaceSearch", function () {
            var placeSearch = new AMap.PlaceSearch({
                pageSize: 8,
                pageIndex: 1,
                city: "全国",
                citylimit: false,
                extensions: "all"
            });
            placeSearch.search(keyword, function (status, result) {
                if (status !== "complete" || !result.poiList || !result.poiList.pois.length) {
                    if (window.Android) Android.onSearchFailed();
                    return;
                }
                var poi = result.poiList.pois[0];
                var lng = poi.location.lng;
                var lat = poi.location.lat;
                setMarker(lng, lat);
                var address = [poi.name, poi.address].filter(Boolean).join(" · ");
                notifyPick(lat, lng, address);
            });
        });
    }

    if (!AMAP_KEY) {
        showHint("请先申请高德 Web 端 Key，并写入项目根目录 local.properties：\nAMAP_KEY=你的Key\nAMAP_SECURITY_CODE=安全密钥\n然后重新 Sync / 编译。\n申请地址：https://console.amap.com/dev/key/app");
    } else {
        window._AMapSecurityConfig = { securityJsCode: AMAP_SECURITY };
        var script = document.createElement("script");
        script.src = "https://webapi.amap.com/maps?v=2.0&key=" + encodeURIComponent(AMAP_KEY);
        script.onload = function () {
            map = new AMap.Map("map", {
                zoom: 5,
                center: [104.195397, 35.86166],
                viewMode: "2D",
                mapStyle: "amap://styles/normal"
            });
            map.on("click", function (e) {
                var lng = e.lnglat.getLng();
                var lat = e.lnglat.getLat();
                setMarker(lng, lat);
                reverse(lng, lat);
            });
        };
        script.onerror = function () {
            showHint("高德地图脚本加载失败，请检查网络和 Key 是否有效。");
        };
        document.head.appendChild(script);
    }
</script>
</body>
</html>
